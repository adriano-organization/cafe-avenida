<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* GitHub Pages: assets must resolve from site root on nested 404 URLs */
      (function () {
        var base = document.createElement("base");
        base.href = /\/cafe-avenida(\/|$)/.test(location.pathname) ? "/cafe-avenida/" : "/";
        document.head.prepend(base);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#DAD2C6" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada — Café Avenida</title>
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/erro.css" />
  </head>
  <body data-page="error" class="erro-page">
    <main class="erro">
      <p class="erro__codigo" aria-hidden="true">404</p>

      <div class="erro__cartao">
        <a class="erro__marca" href="index.html" data-i18n-attr="aria-label:error.home">
          <img class="erro__logo" data-logo src="images/logo.png" alt="Café Avenida" width="96" height="96" />
          <img
            class="erro__wordmark"
            src="images/logo-linha.png"
            alt=""
            width="440"
            height="127"
            decoding="async"
          />
        </a>

        <p class="erro__eyebrow" data-i18n="error.eyebrow">Erro 404</p>
        <h1 class="erro__titulo" data-i18n="error.title">Esta página não está na ementa</h1>
        <p class="erro__texto" data-i18n="error.body">
          Pedimos desculpa — o endereço pode estar errado ou o link já não existir. Volte ao café e escolha por onde
          quer começar.
        </p>

        <div class="erro__acoes">
          <a class="btn btn--primary" href="index.html" data-i18n="error.home">Voltar ao início</a>
          <a class="btn btn--secondary" href="ementa.html" data-href-ementa data-i18n="error.menu">Ver a ementa</a>
        </div>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="js/branding.js"></script>
    <script src="i18n/pt.js"></script>
    <script src="i18n/en.js"></script>
    <script src="js/i18n.js"></script>
    <script>
      (function () {
        const cfg = window.CAFE_CONFIG;
        window.CafeBranding?.apply(cfg);
        window.CafeI18n?.init?.();
        document.title = `${window.CafeI18n?.t("error.docTitle") || "Página não encontrada"} — ${cfg?.name || "Café Avenida"}`;
      })();
    </script>
  </body>
</html>
