<!DOCTYPE html>
<html lang="pt-PT" class="ca-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style id="ca-critical">
      html.ca-loading {
        background: #dad2c6;
        overflow: hidden;
      }
      html.ca-loading body > :not(#ca-transicao) {
        display: none !important;
      }
      #ca-transicao {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #dad2c6;
      }
      #ca-transicao .ca-tr__cena--portas {
        display: none;
      }
      #ca-transicao .ca-panfleto__folha--esq,
      #ca-transicao .ca-panfleto__folha--dir {
        opacity: 0;
        visibility: hidden;
      }
    </style>
    <link rel="stylesheet" href="css/transicao.css" />
    <script>
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.remove("ca-loading");
        document.documentElement.classList.add("ca-page-ready");
      }
    </script>
    <meta name="theme-color" content="#DAD2C6" />
    <title>Ementa — Café Avenida</title>
    <link rel="icon" href="images/logo.png" type="image/png" />
    <meta name="description" content="Ementa digital" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/barra.css" />
    <link rel="stylesheet" href="css/ementa.css" />
  </head>
  <body data-page="ementa">
    <div id="ca-transicao" class="ca-tr ca-tr--panfleto ca-tr--abre" aria-hidden="true">
      <div class="ca-tr__cena ca-tr__cena--portas">

        <div class="ca-tr__caixilho ca-tr__caixilho--lat ca-tr__caixilho--lat-esq" aria-hidden="true"></div>

        <div class="ca-tr__logo-vao">

          </div>
        </div>
        <div class="ca-tr__vidro ca-tr__vidro--esq" aria-hidden="true">
          <span class="ca-tr__puxador"></span>
        </div>
        <div class="ca-tr__vidro ca-tr__vidro--dir" aria-hidden="true">
          <span class="ca-tr__puxador"></span>
        </div>
      </div>
      <div class="ca-tr__cena ca-tr__cena--panfleto">

          </div>
          <div class="ca-panfleto__folha ca-panfleto__folha--meio">
            <p class="ca-panfleto__titulo">Ementa</p>
            <div class="ca-panfleto__linhas">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="ca-panfleto__folha ca-panfleto__folha--dir">
            <p class="ca-panfleto__titulo">Petiscos</p>
            <div class="ca-panfleto__linhas">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
